<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Lospichulos - Inicio</title>
  <link rel="stylesheet" href="Css/sesion.css">
  <link rel="img" href="img/pichulos venta de stock.png">
  <link rel="icon" href="img/pichulos venta de stock.png">
  <link rel="img" href="img/pngfondo.png">
  <link rel="stylesheet" href="css/video.css">
</head>       
<body>
  
  <video autoplay muted loop id="video-fondo">
      <source src="video/video mano ropa.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>
  <main class="login-box">

    <section class="logo">

      <div class="icon"><img src="img/pichulos venta de stock.png" alt="logo"></div>

    <p>Bienvenido a Los Pichulos</p>

    </section>

    <form>

      <label>Correo electrónico</label>

      <input 
      type="email" 
      placeholder="ejemplo@gmail.com"
      required>

      <label>Contraseña</label>

      <input 
      type="password"
      placeholder="********"
      required>

      <button onclick="window.location.href='indexx.html';" class="btn">
        Iniciar sesión
      
      </button>

    </form>

    <section class="extra">

      <p>¿Olvidaste tu contraseña?</p>

      <a href="recuperar.html">Recuperar acceso</a>

    </section>

  </main>

</body>
</html>
